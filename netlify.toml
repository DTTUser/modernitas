# Build settings for deploys from GitHub.
#
# Response headers are not set here on purpose: build.mjs writes dist/_headers
# on every build, so the noindex that protects the staging site comes off in
# the same step that makes the site live, rather than being two separate jobs
# that can disagree with each other.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
